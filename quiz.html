<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Computer Classes - Admin Login</title>
    <link rel="icon" type="image/png" href="LOGO.png">

    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* Modern Dark Mode Design System based on #16363E */
        :root {
            --bg-base: #091013;
            --bg-surface: #101c21;
            --bg-surface-hover: #15252b;
            --primary-dark: #16363E;
            --primary: #21515d;
            --primary-light: #2c6e7e;
            --primary-active: #388a9e;
            --primary-transparent: rgba(44, 110, 126, 0.15);
            --border-w: 1px;
            --border-subtle: #1e333a;
            --border-strong: #2c4953;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-placeholder: #475569;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --radius-md: 8px;
            --radius-lg: 12px;
            --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body.light-theme {
            --bg-base: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f8fafc;
            --border-w: 2px;
            --border-subtle: #cbd5e1;
            --border-strong: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #16363E;
            --primary-light: #2c6e7e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-top {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .btn-icon {
            background: transparent;
            border: var(--border-w) solid var(--border-strong);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: var(--bg-surface-hover);
            border-color: var(--text-muted);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            border: var(--border-w) solid var(--border-subtle);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.25rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: var(--bg-base);
            border: var(--border-w) solid var(--border-strong);
            color: var(--text-main);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--text-placeholder);
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-light);
            background-color: var(--bg-surface);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: #ffffff;
            border: var(--border-w) solid var(--primary-light);
            padding: 0.875rem 1.5rem;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            text-align: center;
            width: 100%;
            letter-spacing: 0.02em;
            margin-top: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-light);
            border-color: var(--primary-active);
        }

        .btn:disabled {
            background-color: var(--bg-surface-hover);
            border-color: var(--border-subtle);
            color: var(--text-placeholder);
            cursor: not-allowed;
        }

        #message {
            margin-top: 1.25rem;
            color: var(--danger);
            font-size: 0.875rem;
            display: none;
            text-align: center;
            background: var(--danger-bg);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: var(--border-w) solid rgba(239, 68, 68, 0.3);
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div class="header-top">
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle light/dark mode">
            <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="login-box">
        <div class="brand-header">
            <div class="brand-name">Gaurav Computer Classes</div>
            <div class="brand-subtitle">Admin Control Center</div>
            <h2>Admin Sign In</h2>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" placeholder="admin@gcc.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginButton" class="btn">
                Sign In to Dashboard
            </button>

            <div id="message"></div>
        </form>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-service.js";
        import {
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('theme-icon-sun');
        const iconMoon = document.getElementById('theme-icon-moon');

        function setTheme(isLight) {
            if (isLight) {
                document.body.classList.add('light-theme');
                iconMoon.style.display = 'block';
                iconSun.style.display = 'none';
            } else {
                document.body.classList.remove('light-theme');
                iconMoon.style.display = 'none';
                iconSun.style.display = 'block';
            }
            localStorage.setItem('gcc-theme', isLight ? 'light' : 'dark');
        }

        setTheme(localStorage.getItem('gcc-theme') === 'light');
        themeToggleBtn.addEventListener('click', () => setTheme(!document.body.classList.contains('light-theme')));

        // Login Handler
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.style.display = 'none';
            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Authenticating...";

            try {
                // 1. Enforce 30-Day Persistent Session in Firebase Auth
                await setPersistence(auth, browserLocalPersistence);

                // 2. Firebase Auth Sign In
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Query Firestore User Profile
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await auth.signOut();
                    throw new Error("Admin profile record not found in Firestore.");
                }

                const userData = userSnap.data();

                // 4. Verify Admin Role & Active Status
                if (userData.role !== "admin" || userData.active !== true) {
                    await auth.signOut();
                    throw new Error("Access Denied. You do not have administrative privileges.");
                }

                // 5. Redirect to Admin Dashboard
                window.location.href = "admin.html";

            } catch (error) {
                console.error(error);
                message.textContent = error.message || "Authentication failed. Please check your credentials.";
                message.style.display = 'block';
                loginButton.disabled = false;
                loginButton.textContent = "Sign In to Dashboard";
            }
        });
    </script>
</body>

</html>
